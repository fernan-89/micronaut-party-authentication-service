# ==============================================================================================
# /**
#  * @file        application.yml
#  * @module      Thinklab Party Authentication Service Core Configuration
#  * @description Centralized configuration manifest for the Micronaut 4.x runtime.
#  *              Orchestrates application identity, Netty reactive engine, OpenAPI/Swagger
#  *              documentation, health/metrics telemetry, and high-performance database
#  *              connection pooling. Adheres to cloud-native and 12-factor app principles.
#  *
#  * @architecture ADR-011: Zero-Trust Resilient Telemetry (Framework-agnostic)
#  *
#  * @maintainer  Thinklab Systems Engineering Team
#  * @target      Production (Mission-Critical NASA-Level Standard)
#  */
# ==============================================================================================

micronaut:
  application:
    name: thinklab-party-authentication-service
    instance:
      id: ${random.shortuuid}

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  Declarative HTTP Clients (Micronaut Service Discovery)
  #  * @description Binds the @Client(id = "hash-service") declarative client used by
  #  *              HashServiceAdapter to the actual Hash Token Registry base URL. Without this
  #  *              binding, Micronaut cannot resolve a target host for the client at runtime.
  #  */
  # ----------------------------------------------------------------------------------------------
  http:
    services:
      hash-service:
        url: ${HASH_SERVICE_URL:`http://localhost:8080`}

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  Netty HTTP Server & Reactive Engine
  #  * @description Optimized for non-blocking I/O (Project Reactor) and container limits.
  #  *              Includes graceful shutdown and aggressive connection recycling.
  #  */
  # ----------------------------------------------------------------------------------------------
  server:
    port: ${MICRONAUT_SERVER_PORT:8082}
    cors:
      enabled: true
    idle-timeout: 60s
    netty:
      max-header-size: 8192
      worker:
        threads: ${NETTY_WORKER_THREADS:0}
      shutdown-quiet-period: 2s
      shutdown-timeout: 10s

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  Serialization Engine (Micronaut Serde)
  #  * @description Reflection-free AOT JSON serialization settings.
  #  */
  # ----------------------------------------------------------------------------------------------
  serde:
    write-dates-as-timestamps: false
    deserialization:
      ignore-unknown: true
    serialization:
      inclusion: NON_NULL

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  OpenAPI / Swagger Routing
  #  * @description Maps static classpath resources generated by the AOT compilation phase.
  #  */
  # ----------------------------------------------------------------------------------------------
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Management Endpoints & Observability
#  * @description Exposes structural application telemetry and dynamic management interfaces.
#  *              All endpoints are blocked at the Ingress level for public traffic.
#  */
# ----------------------------------------------------------------------------------------------
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    kubernetes:
      enabled: true
  metrics:
    enabled: true
    sensitive: false
  prometheus:
    enabled: true
    sensitive: false
  loggers:
    enabled: true
    sensitive: false
  info:
    enabled: true
    sensitive: false

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Data Persistence / Reactive MongoDB Driver
#  * @description Configures the MongoDB driver with production-grade constraints, robust
#  *              connection pooling, and strict write concerns (w: majority).
#  *
#  * @tuning      uuid-representation: STANDARD - Resolves BSON CodecConfigurationException.
#  */
# ----------------------------------------------------------------------------------------------
mongodb:
  uri: ${MONGODB_URI:`mongodb://localhost:27017/thinklab_party_authentication_db`}
  uuid-representation: STANDARD
  cluster:
    server-selection-timeout: 5000ms
  connection-pool:
    max-size: 100
    min-size: 10
    max-wait-time: 12000ms
    max-connection-idle-time: 60000ms
  socket:
    connect-timeout: 5000ms
    read-timeout: 10000ms
  write-concern:
    w: majority
    journal: true
  retry-writes: true

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     External Integrations (Reactive Clients)
#  */
# ----------------------------------------------------------------------------------------------
integrations:
  hash-service:
    url: ${HASH_SERVICE_URL:`http://localhost:8080`}
    read-timeout: 2s
    connect-timeout: 1s

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Eager Initialization / Dependency Warm-up
#  * @description Proactively pings external boundaries during StartupEvent.
#  */
# ----------------------------------------------------------------------------------------------
warmup:
  endpoints:
    hash-service: ${HASH_SERVICE_URL:`http://localhost:8080`}/health/liveness

# ----------------------------------------------------------------------------------------------
# Platform security (ADR-020, ADR-021). This service is the token ISSUER: it signs ES256 tokens with its
# private key (a JWK in THINKLAB_JWT_PRIVATE_KEY; an ephemeral key is generated when unset - development
# only), publishes the public key at /.well-known/jwks.json and lists revoked sessions at /session/revoked.
# Off by default; set THINKLAB_SECURITY_ENABLED=true to require bearer tokens.
# ----------------------------------------------------------------------------------------------
thinklab:
  security:
    enabled: ${THINKLAB_SECURITY_ENABLED:false}
    service-name: thinklab-party-authentication-service
    ttl-seconds: 600
    private-key: ${THINKLAB_JWT_PRIVATE_KEY:}
    revocation-url: ${THINKLAB_REVOCATION_URL:`http://localhost:8082/party-authentication/v1/session/revoked`}
    public-paths:
      - /health
      - /prometheus
      - /metrics
      - /swagger
      - /swagger-ui
      - /openapi
      - /party-authentication/v1/session/initiate
      - /party-authentication/v1/session/refresh
      - /party-authentication/v1/session/revoke
      - /party-authentication/v1/session/revoked
      - /party-authentication/v1/token
      - /party-authentication/v1/.well-known
    # Registered service clients (client id -> secret). A blank secret disables the client.
    service-clients:
      bootstrap: ${THINKLAB_BOOTSTRAP_SECRET:}
      thinklab-party-reference-data-directory-service: ${THINKLAB_CLIENT_SECRET:}
      thinklab-it-asset-registry-service: ${THINKLAB_CLIENT_SECRET:}
      thinklab-it-operation-window-service: ${THINKLAB_CLIENT_SECRET:}
